</style><div class="v"><h2>How Clouds Form</h2><svg viewBox="0 0 600 360" width="100%" xmlns="http://www.w3.org/2000/svg"><rect width="600" height="360" fill="white"/><circle cx="510" cy="70" r="34" fill="#FFD34D" stroke="#E0A800" stroke-width="2"/><text x="510" y="52" font-size="15" text-anchor="middle" fill="#333">Sun</text><path d="M70 300 Q170 300 280 280 Q390 260 500 250" stroke="#0056D2" stroke-width="2" fill="none" stroke-dasharray="6 6"/><text x="90" y="330" font-size="15" fill="#333">Water in lake</text><path d="M90 300 Q85 260 100 230" stroke="#0056D2" stroke-width="3" fill="none" marker-end="url(#a)"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#0056D2"/></marker></defs><text x="115" y="240" font-size="15" fill="#0056D2">Evaporation</text><path d="M120 190 Q160 130 230 110" stroke="#0056D2" stroke-width="2" fill="none" stroke-dasharray="4 4"/><text x="135" y="115" font-size="15" fill="#0056D2">Vapour rises</text><ellipse cx="300" cy="90" rx="70" ry="32" fill="#DCEBFF" stroke="#0056D2" stroke-width="2"/><ellipse cx="350" cy="80" rx="45" ry="25" fill="#DCEBFF" stroke="#0056D2" stroke-width="2"/><text x="320" y="50" font-size="15" fill="#0056D2">Cloud</text><path d="M300 125 Q310 160 330 190" stroke="#0056D2" stroke-width="2" fill="none" stroke-dasharray="4 4"/><text x="335" y="175" font-size="15" fill="#0056D2">Cloud forms</text><path d="M320 215 L315 280" stroke="#0056D2" stroke-width="3" stroke-linecap="round"/><text x="330" y="300" font-size="15" fill="#333">Rain</text><circle cx="300" cy="90" r="3" fill="#0056D2"/><circle cx="330" cy="85" r="3" fill="#0056D2"/><circle cx="360" cy="95" r="3" fill="#0056D2"/></svg><p class="note">The Sun heats water. It turns into vapour, rises, cools, and forms tiny water drops in a cloud. Then it rains.</p></div>
