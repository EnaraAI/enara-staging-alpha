# Marketing only (owner request 21 Nov 2026): narration for the ENARA school film. Runs on pushes to this branch that change the
# narration; writes the WAV files to the orphan branch claude/tutor-marketing-assets. No product code, no deploy, no secrets.
name: marketing tts
on:
  push:
    branches: ['claude/tutor-marketing-video']
    paths: ['marketing/video/narration.json', 'marketing/video/tts.py', '.github/workflows/marketing-tts.yml']
permissions:
  contents: write
jobs:
  tts:
    if: github.repository == 'EnaraAI/enara-staging-alpha'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng >/dev/null
      - run: pip install -q "kokoro>=0.9.4" soundfile
      - name: Narration
        working-directory: marketing/video
        run: python tts.py
      - name: Publish to claude/tutor-marketing-assets
        working-directory: marketing/video/out
        run: |
          git init -q && git checkout -q -b claude/tutor-marketing-assets
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -qm "marketing narration ${GITHUB_SHA::8}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" claude/tutor-marketing-assets
