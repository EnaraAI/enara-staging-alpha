# Probe for the LMS end-to-end automation (lms-test only): can GitHub's runners
# reach MoodleCloud and lms-test, and is Docker available? No secrets used.
name: lms-e2e-probe
on:
  push:
    branches: [claude/lms-e2e]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: MoodleCloud reachability (status code only)
        run: curl -s -o /dev/null -w "moodlecloud login: %{http_code}\n" -m 20 https://lms-test-enara.moodlecloud.com/login/index.php || true
      - name: lms-test reachability
        run: curl -s -m 20 https://lms-test.enara.app/ready | head -c 200; echo
      - name: Docker
        run: docker version --format '{{.Server.Version}}' && docker compose version
