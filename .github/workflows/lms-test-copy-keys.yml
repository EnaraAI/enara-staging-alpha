# One-off (owner "Turn AI on", 21 Nov 2026): AI_PAUSED=false on enara-lms-test Production only (deploy/lms-test/ai-on.mjs).
name: lms-test ai on
on:
  push:
    branches: ['claude/tutor-lms-aion-run']
    paths: ['deploy/lms-test/ai-on.mjs', '.github/workflows/lms-test-copy-keys.yml']
permissions:
  contents: read
jobs:
  aion:
    if: github.repository == 'EnaraAI/enara-staging-alpha'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set AI_PAUSED=false (lms-test only)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node deploy/lms-test/ai-on.mjs
