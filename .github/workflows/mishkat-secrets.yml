# Owner, 24 Nov 2026 ("Do it yourself"): one random shared token for the Mishkat service. Saved to the Modal secret "mishkat-auth"
# (key MISHKAT_TOKEN) and to the lms-test Vercel project (MISHKAT_TOKEN, Sensitive, production). Never printed (masked), never
# committed. Only lms-test; test.enara.app is never touched. MISHKAT_ENDPOINT is set by the service deploy, from its real URL.
name: Mishkat shared token
on:
  push:
    branches: ['claude/tutor-lms-dscompare-run']
    paths: ['deploy/modal/mishkat-secrets/**', '.github/workflows/mishkat-secrets.yml']
permissions:
  contents: read
jobs:
  token:
    if: github.repository == 'EnaraAI/enara-staging-alpha'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      VERCEL_TOKEN_NEW: ${{ secrets.VERCEL_TOKEN_NEW }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Generate, save to Modal and to lms-test (value masked, never printed)
        run: |
          set -euo pipefail
          T=$(openssl rand -hex 32); echo "::add-mask::$T"
          pip install -q modal
          modal secret create mishkat-auth "MISHKAT_TOKEN=$T" --force > /dev/null && echo "Modal secret mishkat-auth: set"
          VAL="$T" node deploy/modal/mishkat-secrets/set_vercel_env.mjs MISHKAT_TOKEN sensitive
