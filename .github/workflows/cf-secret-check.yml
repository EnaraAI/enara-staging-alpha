# Owner, 27 Nov 2026: "You have a Cloudflare API token, use it". Reports only WHETHER likely secret names are set
# (set / not set), never a value. If one is set, checks it with Cloudflare's read-only token verify endpoint (status only).
name: cloudflare secret presence
on:
  push:
    branches: ['claude/tutor-lms-dscompare-run']
    paths: ['deploy/cfcheck/trigger.txt']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Presence and verify (no values printed)
        env:
          S_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          S_CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          S_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          S_CF_TOKEN: ${{ secrets.CF_TOKEN }}
          S_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          S_CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          S_CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          S_CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          S_R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          S_CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          S_CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
        run: |
          for n in CLOUDFLARE_API_TOKEN CF_API_TOKEN CLOUDFLARE_TOKEN CF_TOKEN CLOUDFLARE_ACCOUNT_ID CF_ACCOUNT_ID CLOUDFLARE_ZONE_ID CF_ZONE_ID R2_ACCOUNT_ID CLOUDFLARE_API_KEY CLOUDFLARE_EMAIL; do
            v="S_$n"; if [ -n "${!v}" ]; then echo "$n: set"; else echo "$n: not set"; fi
          done
          for n in CLOUDFLARE_API_TOKEN CF_API_TOKEN CLOUDFLARE_TOKEN CF_TOKEN; do
            v="S_$n"; [ -n "${!v}" ] || continue
            code=$(curl -s -o /tmp/r.json -w '%{http_code}' -H "Authorization: Bearer ${!v}" https://api.cloudflare.com/client/v4/user/tokens/verify)
            echo "$n verify: HTTP $code, $(python3 -c "import json;d=json.load(open('/tmp/r.json'));print('success' if d.get('success') else 'failed', (d.get('result') or {}).get('status'))")"
          done
