# Owner (22 Nov 2026): load (or remove) the full data set on lms-test. Counts only in the log; no secrets.
name: lms-test full data set
on:
  push:
    branches: ['claude/tutor-lms-dscompare-run']
    paths: ['deploy/lms-test/fullseed/**', '!deploy/lms-test/fullseed/shots.*', '.github/workflows/lms-test-fullseed.yml']
permissions:
  contents: read
jobs:
  seed:
    if: github.repository == 'EnaraAI/enara-staging-alpha'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Full data set (lms-test)
        env:
          LMSTEST_MAINTENANCE_TOKEN: ${{ secrets.LMSTEST_MAINTENANCE_TOKEN }}
          ACTION: run-school-app # parents school app data only (no users or passwords touched); was: rerun
        run: node deploy/lms-test/fullseed/run.mjs
