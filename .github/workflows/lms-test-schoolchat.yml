# Parents school app (e): the assistant on lms-test with DeepSeek (one question per call, as seeded parents). Counts and seed answers only.
name: lms-test school chat check
on:
  push:
    branches: ['claude/tutor-lms-dscompare-run']
    paths: ['deploy/lms-test/schoolchat/trigger.txt', '.github/workflows/lms-test-schoolchat.yml']
permissions:
  contents: read
jobs:
  check:
    if: github.repository == 'EnaraAI/enara-staging-alpha'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Health check on the live deployment (3 times, read-only probe)
        if: hashFiles('deploy/lms-test/schoolchat/probe-health') != ''
        continue-on-error: true
        env:
          LMSTEST_MAINTENANCE_TOKEN: ${{ secrets.LMSTEST_MAINTENANCE_TOKEN }}
        run: for i in 1 2 3; do node deploy/lms-test/cli.mjs maintenance run || true; sleep 5; done
      - name: School chat check (lms-test)
        if: hashFiles('deploy/lms-test/schoolchat/probe-health') == ''
        env:
          SEED_USER_PASSWORD: ${{ secrets.SEED_USER_PASSWORD }}
          LMSTEST_MAINTENANCE_TOKEN: ${{ secrets.LMSTEST_MAINTENANCE_TOKEN }}
        run: ONLY="$(sed -n 2p deploy/lms-test/schoolchat/trigger.txt)" node deploy/lms-test/schoolchat/run.mjs
