# Mishkat (owner go, 23 Nov 2026): two-stage training (LAILA/ELLIPSE, then ENARA MODEL-MARKED labels; owner corrections win) and the
# held-out evaluation next to v3b. Development only. CPU, no secrets. Numbers only to claude/tutor-lms-mishkat-results-<lang>.
name: lms-test Mishkat training
on:
  push:
    branches: ['claude/tutor-lms-dscompare-run']
    paths: ['deploy/lms-test/mishkat/run-langs.txt', 'deploy/lms-test/mishkat/train_mishkat.py', 'deploy/lms-test/mishkat/mishkat_features.py', '.github/workflows/lms-test-mishkat-train.yml']
permissions:
  contents: write
jobs:
  plan:  # which languages this push trains (deploy/lms-test/mishkat/run-langs.txt; default both), so a fix to one never restarts the other
    if: github.repository == 'EnaraAI/enara-staging-alpha'
    runs-on: ubuntu-latest
    outputs: { matrix: '${{ steps.m.outputs.matrix }}' }
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          L=$(cat deploy/lms-test/mishkat/run-langs.txt 2>/dev/null || echo "en ar")
          python3 -c "import json,sys; all_={'en':{'lang':'en','stage1':'ellipse,asap2,persuade','premax':'0'},'ar':{'lang':'ar','stage1':'araes,arasag','premax':'0'}}; print('matrix='+json.dumps({'include':[all_[l] for l in sys.argv[1:] if l in all_]}))" $L >> "$GITHUB_OUTPUT"
  train:
    needs: plan
    if: github.repository == 'EnaraAI/enara-staging-alpha'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Mishkat data (model-marked) and today's v3b numbers on the human-scored essays
        run: |
          git fetch -q --depth 1 origin claude/tutor-lms-mishkat && git worktree add -q mk FETCH_HEAD
          git fetch -q --depth 1 origin claude/tutor-lms-recal-results && git show FETCH_HEAD:summary.json > v3b-human.json
      - name: Word lists (SCOWL en_US, Ayaspell ar) and a check
        run: |
          sudo apt-get install -y -q hunspell hunspell-en-us hunspell-ar >/dev/null
          printf '^This sentense has a mistake\n^هذه جمله فيها خطا\n' | hunspell -a -d en_US | grep -c '^&' 
          printf '^هذه جمله فيها خطا\n' | hunspell -a -d ar | head -5
      - name: Libraries
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q numpy pandas scipy transformers sentencepiece protobuf tiktoken
      - name: Feature cache (encoder readings; feature version v1)
        uses: actions/cache/restore@v4
        with:
          path: deploy/lms-test/mishkat/cache
          key: mishkat-feat-v1-${{ matrix.lang }}-${{ hashFiles('mk/data/mishkat-dev/pool-*.json') }}
          restore-keys: mishkat-feat-v1-${{ matrix.lang }}-${{ hashFiles('mk/data/mishkat-dev/pool-*.json') }}-
      - name: Train and evaluate
        working-directory: deploy/lms-test/mishkat
        env: { HF_HUB_DISABLE_PROGRESS_BARS: '1', TRANSFORMERS_VERBOSITY: error, MK_LANG: '${{ matrix.lang }}', MK_STAGE1: '${{ matrix.stage1 }}', MK_PRE_MAX: '${{ matrix.premax }}', MK_EGYPT: "${{ matrix.lang == 'ar' && '1' || '0' }}", MK_AUG: "${{ matrix.lang == 'ar' && '1' || '0' }}", MK_DATA: '${{ github.workspace }}/mk/data/mishkat-dev', MK_BASELINE: '${{ github.workspace }}/v3b-human.json', MK_V3B: '${{ github.workspace }}/v3b-human.json', MK_COMPARE: '${{ github.workspace }}/mk/data/mishkat-dev/claude-compare/compare-${{ matrix.lang }}.json', MK_EXPORT: '1', MK_EXPORT_LANGS: 'en' }
        run: python train_mishkat.py 2>&1 | tee train.log
      - name: Save feature cache (also after a crash)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: deploy/lms-test/mishkat/cache
          key: mishkat-feat-v1-${{ matrix.lang }}-${{ hashFiles('mk/data/mishkat-dev/pool-*.json') }}-${{ github.run_id }}
      # Service bundle (deploy/modal/mishkat): an Actions artifact only, never committed. Arabic is exported only after the owner adds
      # 'ar' to MK_EXPORT_LANGS (after its length tests pass); until then no Arabic artifact exists.
      - name: Upload service bundle (artifact, 30 days)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mishkat-bundle-${{ matrix.lang }}
          path: deploy/lms-test/mishkat/results/bundle-${{ matrix.lang }}/
          retention-days: 30
          if-no-files-found: ignore
      - name: Publish (numbers only)
        if: always()
        working-directory: deploy/lms-test/mishkat
        run: |
          B=claude/tutor-lms-mishkat-results-${{ matrix.lang }}
          [ -f results/report.json ] || B="$B-failed"  # a stopped or crashed run never overwrites the last good report
          mkdir -p results && cp train.log results/ 2>/dev/null || true
          rm -rf results/bundle-*  # the model bundle goes to the artifact above, never to a branch
          cd results && git init -q && git checkout -q -b "$B"
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -qm "Mishkat training ${{ matrix.lang }} ${GITHUB_SHA::8}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$B"
