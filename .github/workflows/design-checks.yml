# design.enara.app checks (owner, 27 Nov 2026): Playwright, every role and screen, en/ar, phone/desktop, against the real
# lms-test API. The page is served from this build at https://design.enara.app inside the browser (no Access credential
# needed); the deployed copy is checked separately. Only on branch claude/design-app. Never test.enara.app.
name: design.enara.app checks
on:
  push:
    branches: ['claude/design-app', 'claude/design-app-*']
    paths: ['design-app/**', '.github/workflows/design-checks.yml']
permissions:
  contents: write  # only to publish screenshots to the orphan branch design-check-results
concurrency: { group: 'design-checks-${{ github.ref }}', cancel-in-progress: true }
jobs:
  checks:
    if: github.repository == 'EnaraAI/enara-staging-alpha'
    runs-on: ubuntu-latest
    container: { image: 'mcr.microsoft.com/playwright:v1.56.1-noble' }  # browsers included
    timeout-minutes: 25
    defaults: { run: { working-directory: design-app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit -p . && VITE_API_BASE=https://lms-test.enara.app npx vite build
      - run: npm i --no-save playwright@1.56.1
      - name: Checks (lms-test, seed accounts)
        env:
          SEED_USER_PASSWORD: ${{ secrets.SEED_USER_PASSWORD }}
          ONLY_ROLES: ${{ vars.DESIGN_CHECK_ROLES }}
        run: node checks/run.mjs
      - name: Publish screenshots and summary (orphan branch design-check-results, overwritten each run)
        if: always()
        working-directory: design-app/checks/out
        shell: bash
        run: |
          git init -q && git checkout -q -b r && git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -qm "design checks ${GITHUB_SHA::8} (${GITHUB_REF_NAME})" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "r:design-check-results-${GITHUB_REF_NAME//\//-}"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: design-checks, path: design-app/checks/out, retention-days: 7 }
