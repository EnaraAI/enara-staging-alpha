# Mishkat scoring service (deploy/modal/mishkat): takes the newest model bundle artifact(s) from "lms-test Mishkat training", puts them
# on the Modal Volume "mishkat-bundles" and runs `modal deploy`. Needs the repo secrets MODAL_TOKEN_ID / MODAL_TOKEN_SECRET (the owner
# adds them); without them the job says so and ends green. Secret values are never printed. The Modal secret "mishkat-auth"
# (key MISHKAT_TOKEN) must exist in the Modal workspace before the first deploy.
name: Mishkat service deploy (Modal)
on:
  workflow_dispatch:
  push:
    paths: ['deploy/modal/mishkat/**']
permissions:
  contents: read
  actions: read
concurrency: { group: mishkat-deploy, cancel-in-progress: false }
jobs:
  deploy:
    if: github.repository == 'EnaraAI/enara-staging-alpha'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Modal secrets set?
        id: gate
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "Modal secrets not set; skipping"; echo "::notice::Modal secrets not set; skipping"; echo "skip=1" >> "$GITHUB_OUTPUT"
          else echo "skip=0" >> "$GITHUB_OUTPUT"; fi
      - if: steps.gate.outputs.skip == '0'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.skip == '0'
        uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Local test of the scoring code (fake bundle, no Modal)
        if: steps.gate.outputs.skip == '0'
        run: |
          sudo apt-get install -y -q hunspell hunspell-en-us hunspell-ar >/dev/null
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q numpy pytest
          python -m pytest -q deploy/modal/mishkat/test_scorer.py
      - name: Newest bundle artifact per language (from the training workflow)
        if: steps.gate.outputs.skip == '0'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          for L in en ar; do
            RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=mishkat-bundle-$L&per_page=20" --jq '[.artifacts[] | select(.expired == false)][0].workflow_run.id // empty')
            if [ -z "$RUN" ]; then echo "$L: no bundle artifact (not exported or expired)"; continue; fi
            gh run download "$RUN" -R "$GITHUB_REPOSITORY" -n "mishkat-bundle-$L" -D "bundles/$L"
            jq -r '"\(.lang): \(.version), served \(.types | map_values(.served) | tostring)"' "bundles/$L/manifest.json"
          done
          ls bundles/*/manifest.json >/dev/null 2>&1 || echo "::warning::no bundle artifact found; deploying the service code only (every request will get 404)"
      - name: Upload bundles to the Modal Volume and deploy
        if: steps.gate.outputs.skip == '0'
        run: |
          pip install -q modal
          modal volume create mishkat-bundles >/dev/null 2>&1 || true
          for d in bundles/*; do
            [ -f "$d/manifest.json" ] || continue
            L=$(basename "$d"); modal volume put --force mishkat-bundles "$d" "/$L"; echo "uploaded $L"
          done
          modal deploy deploy/modal/mishkat/app.py
