# Mishkat scoring service (deploy/modal/mishkat): takes the newest model bundle artifact(s) from "lms-test Mishkat training", puts them
# on the Modal Volume "mishkat-bundles" and runs `modal deploy`. Needs the repo secrets MODAL_TOKEN_ID / MODAL_TOKEN_SECRET (the owner
# adds them); without them the job says so and ends green. Secret values are never printed. The Modal secret "mishkat-auth"
# (key MISHKAT_TOKEN) must exist in the Modal workspace before the first deploy.
name: Mishkat service deploy (Modal)
on:
  workflow_dispatch:
  push:
    paths: ['deploy/modal/mishkat/**']
permissions:
  contents: write
  actions: read
concurrency: { group: mishkat-deploy, cancel-in-progress: false }
jobs:
  deploy:
    if: github.repository == 'EnaraAI/enara-staging-alpha'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Modal secrets set?
        id: gate
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "Modal secrets not set; skipping"; echo "::notice::Modal secrets not set; skipping"; echo "skip=1" >> "$GITHUB_OUTPUT"
          else echo "skip=0" >> "$GITHUB_OUTPUT"; fi
      - if: steps.gate.outputs.skip == '0'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.skip == '0'
        uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Local test of the scoring code (fake bundle, no Modal)
        if: steps.gate.outputs.skip == '0'
        run: |
          sudo apt-get install -y -q hunspell hunspell-en-us hunspell-ar >/dev/null
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q numpy pytest
          python -m pytest -q deploy/modal/mishkat/test_scorer.py
      - name: Bundles on the Modal Volume (written by "Mishkat bundles on GPU"), and the service secret
        if: steps.gate.outputs.skip == '0'
        run: |
          pip install -q modal
          for L in en ar; do echo "$L:"; modal volume ls mishkat-bundles "/$L" 2>/dev/null | grep -E "manifest.json|encoder|\.pt" || echo "  no bundle"; done
          # names only: the service needs the Modal secret "mishkat-auth" (key MISHKAT_TOKEN), which the owner creates
          if ! modal secret list 2>/dev/null | grep -q "mishkat-auth"; then
            echo "::error::Modal secret 'mishkat-auth' (key MISHKAT_TOKEN) is missing; the owner creates it in Modal, then re-run"; exit 1
          fi
      - name: Deploy the service
        id: dep
        if: steps.gate.outputs.skip == '0'
        run: |
          modal deploy deploy/modal/mishkat/app.py 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-z0-9-]+--mishkat-web[a-z0-9-]*\.modal\.run' deploy.log | head -1)
          [ -n "$URL" ] || { echo "::error::no service URL in the deploy output"; exit 1; }
          echo "url=$URL" >> "$GITHUB_OUTPUT"; echo "service: $URL"
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip == '0'
        with: { node-version: '22' }
      - name: Check the service (health; no token = refused) and point lms-test at it (MISHKAT_ENDPOINT, plain)
        if: steps.gate.outputs.skip == '0'
        env: { VERCEL_TOKEN_NEW: '${{ secrets.VERCEL_TOKEN_NEW }}', URL: '${{ steps.dep.outputs.url }}' }
        run: |
          set -euo pipefail
          curl -sS --max-time 120 "$URL/health"; echo
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 -X POST "$URL/score" -H 'Content-Type: application/json' -d '{"lang":"en","type":"essay","text":"x"}')
          echo "score without a token: HTTP $code (401 expected)"; [ "$code" = 401 ]
          VAL="$URL/score" node deploy/modal/mishkat-secrets/set_vercel_env.mjs MISHKAT_ENDPOINT plain
      - name: Load test, 200 answers at once (cold, then warm); numbers only
        if: steps.gate.outputs.skip == '0'
        env: { URL: '${{ steps.dep.outputs.url }}' }
        run: |
          git fetch -q --depth 1 origin claude/tutor-lms-mishkat && git worktree add -q mk FETCH_HEAD
          MK_EVAL_DATA="$GITHUB_WORKSPACE/mk/data/mishkat-dev" modal run deploy/modal/mishkat-loadtest/loadtest.py --url "$URL/score" --out loadtest.json
          mkdir -p pub && cp loadtest.json pub/ && cd pub && git init -q && git checkout -q -b r && git add -A && git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Mishkat service load test ${GITHUB_SHA::8}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" r:claude/tutor-lms-mishkat-service
