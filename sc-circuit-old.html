</style><div class="v"><h2>Why a gap stops the bulb lighting</h2><svg viewBox="0 0 600 360" width="100%" xmlns="http://www.w3.org/2000/svg"><rect width="600" height="360" fill="white"/><rect x="60" y="150" width="110" height="60" rx="6" fill="#e8f0fb" stroke="#0056D2" stroke-width="3"/><text x="115" y="185" text-anchor="middle" font-size="16" fill="#0056D2">Battery</text><path d="M170 160 H320" stroke="#0056D2" stroke-width="4" fill="none"/><path d="M170 200 H320" stroke="#0056D2" stroke-width="4" fill="none"/><path d="M320 160 V120 H450 V160" stroke="#0056D2" stroke-width="4" fill="none"/><circle cx="450" cy="195" r="35" fill="#fff" stroke="#0056D2" stroke-width="3"/><path d="M425 195 L475 195 M450 170 L450 220" stroke="#0056D2" stroke-width="3"/><text x="450" y="255" text-anchor="middle" font-size="16" fill="#0056D2">Bulb</text><path d="M450 230 V200" stroke="#0056D2" stroke-width="4"/><path d="M320 230 V200" stroke="#0056D2" stroke-width="4"/><path d="M320 230 H400" stroke="#0056D2" stroke-width="4" fill="none"/><path d="M420 230 H450" stroke="#0056D2" stroke-width="4" fill="none"/><text x="410" y="215" text-anchor="middle" font-size="15" fill="#d62828">gap</text><path d="M400 230 L408 218 M408 230 L400 218 M420 230 L428 218 M428 230 L420 218" stroke="#d62828" stroke-width="2"/><text x="115" y="290" font-size="15" fill="#0056D2">No loop = no current</text><text x="330" y="290" font-size="15" fill="#0056D2">Close the gap = light!</text></svg><p class="note">The battery pushes current around a full loop. A gap in the wire breaks the loop, so no current reaches the bulb and it stays dark.</p></div>
