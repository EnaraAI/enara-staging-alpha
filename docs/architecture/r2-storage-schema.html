<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#f6f8fb;font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif}
text{font-family:inherit}
</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#475569"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#059669"/></marker>
<marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#d97706"/></marker>
</defs>
<text x="40" y="52" font-size="28" font-weight="700" fill="#0f172a">ENARA Staging: R2 storage schema</text>
<text x="40" y="80" font-size="15" fill="#475569">Bucket enara-staging-alpha-uploads · token scoped to this bucket only · R2 is mandatory in staging (no local-disk fallback)</text>

<!-- Clients -->
<rect x="40" y="120" width="300" height="300" rx="14" fill="#fff" stroke="#cbd5e1"/>
<text x="60" y="152" font-size="18" font-weight="700" fill="#0f172a">Browser (staging site)</text>
<text x="60" y="180" font-size="14" fill="#334155">Teacher / Workspace Admin</text>
<rect x="60" y="200" width="260" height="56" rx="8" fill="#eef2ff"/><text x="74" y="224" font-size="14" fill="#1e293b">Documents: PDF, DOCX, TXT</text><text x="74" y="244" font-size="12" fill="#475569">via API · ≤ 4.5 MB on Vercel</text>
<rect x="60" y="268" width="260" height="56" rx="8" fill="#eef2ff"/><text x="74" y="292" font-size="14" fill="#1e293b">Lesson videos: MP4, WEBM</text><text x="74" y="312" font-size="12" fill="#475569">direct to R2 · up to 1 GB</text>
<rect x="60" y="336" width="260" height="64" rx="8" fill="#ecfdf5"/><text x="74" y="360" font-size="14" fill="#1e293b">Downloads</text><text x="74" y="380" font-size="12" fill="#475569">signed /uploads links (≈6 h)</text><text x="74" y="396" font-size="12" fill="#475569">unscanned → warning + confirm</text>

<!-- API -->
<rect x="440" y="120" width="360" height="440" rx="14" fill="#fff" stroke="#cbd5e1"/>
<text x="460" y="152" font-size="18" font-weight="700" fill="#0f172a">Backend function (Vercel)</text>
<text x="460" y="176" font-size="13" fill="#475569">services/uploadStorage.ts → S3 API at</text>
<text x="460" y="194" font-size="13" fill="#475569">&lt;account-id&gt;.r2.cloudflarestorage.com</text>
<g font-size="13" fill="#1e293b">
<rect x="460" y="212" width="320" height="40" rx="7" fill="#f1f5f9"/><text x="474" y="237">saveUpload: PUT uploads/&lt;name&gt;</text>
<rect x="460" y="260" width="320" height="40" rx="7" fill="#f1f5f9"/><text x="474" y="285">createDirectUploadUrl: signed PUT (1 h)</text>
<rect x="460" y="308" width="320" height="40" rx="7" fill="#f1f5f9"/><text x="474" y="333">inspectUpload: HEAD + first 16 bytes</text>
<rect x="460" y="356" width="320" height="40" rx="7" fill="#f1f5f9"/><text x="474" y="381">readUpload: GET (docs, extraction)</text>
<rect x="460" y="404" width="320" height="40" rx="7" fill="#f1f5f9"/><text x="474" y="429">createDownloadUrl: signed GET (1 h, video)</text>
<rect x="460" y="452" width="320" height="40" rx="7" fill="#f1f5f9"/><text x="474" y="477">deleteUpload: DELETE (user or retention)</text>
</g>
<text x="460" y="526" font-size="12" fill="#475569">Every call: one bucket, prefix "uploads/",</text>
<text x="460" y="543" font-size="12" fill="#475569">path.basename(name) so no "../" escapes</text>

<!-- R2 bucket -->
<rect x="900" y="120" width="660" height="440" rx="14" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
<text x="922" y="154" font-size="19" font-weight="700" fill="#7c2d12">R2 bucket: enara-staging-alpha-uploads</text>
<text x="922" y="178" font-size="13" fill="#9a3412">Standard storage · Eastern North America · free tier 10 GB</text>
<rect x="922" y="196" width="616" height="340" rx="10" fill="#fff" stroke="#fdba74"/>
<text x="942" y="226" font-size="16" font-weight="700" fill="#0f172a">📁 uploads/</text>
<text x="942" y="250" font-size="12" fill="#475569">flat folder · key = uploads/&lt;random UUID&gt;-&lt;sanitised file name&gt;</text>
<g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#1e293b">
<text x="962" y="284">📄 3f2a…-photosynthesis-notes.txt</text><text x="1330" y="284" font-family="inherit" font-size="12" fill="#b45309">document · not scanned</text>
<text x="962" y="312">📄 9c41…-unit-2-reading.pdf</text><text x="1330" y="312" font-family="inherit" font-size="12" fill="#475569">document</text>
<text x="962" y="340">📄 77be…-lesson-notes.docx</text><text x="1330" y="340" font-family="inherit" font-size="12" fill="#475569">lesson file</text>
<text x="962" y="368">🎬 a0d5…-main-idea-video.mp4</text><text x="1330" y="368" font-family="inherit" font-size="12" fill="#475569">lesson video</text>
<text x="962" y="396">…</text>
</g>
<text x="942" y="436" font-size="13" fill="#334155">• No per-school folders: the random UUID makes names unguessable</text>
<text x="942" y="458" font-size="13" fill="#334155">• Ownership, school and lesson live in MongoDB (below)</text>
<text x="942" y="480" font-size="13" fill="#334155">• Raw files are never sent to AI; only extracted text is used</text>
<text x="942" y="502" font-size="13" fill="#334155">• Browser access needs the bucket CORS rule for the staging site</text>
<text x="942" y="524" font-size="13" fill="#334155">  (video PUT/GET only)</text>

<!-- arrows top -->
<line x1="340" y1="228" x2="438" y2="228" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<line x1="800" y1="232" x2="898" y2="232" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<path d="M340 296 L 390 296 L 390 600 L 1100 600 L 1100 562" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#o)"/>
<text x="410" y="590" font-size="12" fill="#b45309">video bytes: browser → R2 with signed PUT (skips the function)</text>
<line x1="438" y1="370" x2="342" y2="370" stroke="#059669" stroke-width="2" marker-end="url(#g)"/>

<!-- Mongo -->
<rect x="40" y="640" width="1520" height="300" rx="14" fill="#fff" stroke="#cbd5e1"/>
<text x="62" y="674" font-size="18" font-weight="700" fill="#0f172a">MongoDB Atlas: enara_staging_alpha (the index to R2; enforces school isolation)</text>
<g font-size="13">
<rect x="62" y="694" width="470" height="220" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="80" y="722" font-weight="700" fill="#0f172a">curriculum_file_jobs (one per document)</text>
<text x="80" y="748" fill="#334155">id → uploadId</text>
<text x="80" y="770" fill="#334155">fileUrl → "/uploads/&lt;key name&gt;"  ⟶ R2 object</text>
<text x="80" y="792" fill="#334155">institutionId, curriculumId, lessonId</text>
<text x="80" y="814" fill="#334155">scanStatus: deferred | clean | pending | failed | infected</text>
<text x="80" y="836" fill="#334155">rightsAttestation, sizeBytes, contentType</text>
<text x="80" y="858" fill="#334155">status (extraction), chunkCount, pages</text>
<text x="80" y="884" fill="#b45309">download link only if clean / not_required / deferred</text>

<rect x="552" y="694" width="470" height="220" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="570" y="722" font-weight="700" fill="#0f172a">curricula.chapters[].uploads</text>
<text x="570" y="748" fill="#334155">["/uploads/&lt;key name&gt;", …]</text>
<text x="570" y="770" fill="#334155">lesson files and videos attached to a lesson</text>
<text x="570" y="810" font-weight="700" fill="#0f172a">curriculum_chunks</text>
<text x="570" y="836" fill="#334155">extracted text passages (not the file)</text>
<text x="570" y="858" fill="#334155">uploadId, fileUrl, institutionId, contentHash</text>
<text x="570" y="884" fill="#334155">used for AI Chat sources and retrieval</text>

<rect x="1042" y="694" width="496" height="220" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="1060" y="722" font-weight="700" fill="#0f172a">Lifecycle</text>
<text x="1060" y="748" fill="#334155">Upload → validate type, size and signature</text>
<text x="1060" y="770" fill="#334155">→ PUT to R2 → job record → extract text</text>
<text x="1060" y="792" fill="#334155">Delete (user) → R2 DELETE + chunks + job</text>
<text x="1060" y="814" fill="#334155">Retention: deleted 180 days after the</text>
<text x="1060" y="836" fill="#334155">school's pilot ends (default)</text>
<text x="1060" y="866" fill="#475569">Not in R2: /api/upload (orchestrator ingest)</text>
<text x="1060" y="886" fill="#475569">uses AWS S3; unset in staging → 503</text>
</g>
<line x1="1330" y1="638" x2="1330" y2="564" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#a)"/><text x="1340" y="616" font-size="12" fill="#64748b">fileUrl points to the R2 object</text>
<text x="40" y="1000" font-size="12" fill="#64748b">Source: staging repository EnaraAI/enara-staging-alpha (backend/src/services/uploadStorage.ts, services/documents.ts, controllers/curriculum.controller.ts, models/CurriculumChunk.ts). Example file names are illustrative.</text>
</svg></body></html>
