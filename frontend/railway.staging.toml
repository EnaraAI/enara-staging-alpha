# Railway config for the staging frontend (project enara-staging-alpha,
# service enara-staging-frontend, root directory "frontend"). Set this file
# as the service's config path; the existing deployment files are not used.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.staging"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
