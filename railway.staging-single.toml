# ENARA staging, single service ($0 plan). Service root directory: repository
# root. Deploy only from staging-alpha with auto-deploy off; turn Serverless on.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.staging-single"

[deploy]
healthcheckPath = "/ready"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
