# Railway config for the staging backend (project enara-staging-alpha,
# service enara-staging-backend, root directory "backend"). Set this file as
# the service's config path. Same build/start as railway.toml; migrations are
# not run on start (RUN_MIGRATIONS_ON_START=false is required by the staging
# guard) and are applied by hand with `npm run migrate`.
[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[deploy]
startCommand = "npm start"
healthcheckPath = "/ready"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
