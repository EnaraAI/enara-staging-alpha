<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ENARA Sales</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ENARA admin theme tokens (design-app/src/styles.css, [data-theme='admin'] and its dark values). */
:root{color-scheme:light;--font-latin:Inter,ui-sans-serif,system-ui,sans-serif;--radius:.5rem;
--background:oklch(0.982 0.003 255);--foreground:oklch(0.22 0.025 262);--card:oklch(1 0 0);--primary:oklch(0.33 0.08 263);--primary-foreground:oklch(0.985 0 0);
--accent:oklch(0.82 0.15 78);--muted-foreground:oklch(0.5 0.02 260);--border:oklch(0.91 0.006 255);--input:oklch(0.82 0.008 255);--ring:oklch(0.58 0.14 255);
--destructive-text:oklch(0.5 0.19 27);--mark:#071530}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--background:oklch(0.18 0.015 262);--foreground:oklch(0.94 0.006 255);--card:oklch(0.22 0.018 262);
--primary:oklch(0.78 0.09 255);--primary-foreground:oklch(0.2 0.04 262);--muted-foreground:oklch(0.72 0.015 255);--border:oklch(0.3 0.02 262);--input:oklch(0.42 0.02 262);--destructive-text:oklch(0.78 0.13 27);--mark:#ffffff}}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;min-height:100%}
body{background:var(--background);color:var(--foreground);font:15px/1.55 var(--font-latin);display:grid;place-items:center;min-height:100dvh;padding:16px;
background-image:linear-gradient(180deg,color-mix(in oklch,var(--primary) 8%,transparent),transparent 45%)}
main{width:min(400px,100%);background:var(--card);border:1px solid var(--border);border-top:4px solid var(--accent);border-radius:14px;padding:28px 24px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.mark{width:34px;height:34px;color:var(--mark)}
.word{font-weight:700;font-size:22px;letter-spacing:.06em}
.sub{font-weight:500;color:var(--muted-foreground);padding-left:10px;border-left:1px solid var(--border)}
h1{font-weight:700;font-size:24px;line-height:1.2;margin:0 0 4px}
p{margin:0 0 18px;color:var(--muted-foreground)}
label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
input{font:16px var(--font-latin);color:var(--foreground);background:var(--card);border:1px solid var(--input);border-radius:var(--radius);padding:12px;width:100%;min-height:48px}
button{margin-top:14px;width:100%;min-height:48px;border:0;border-radius:var(--radius);background:var(--primary);color:var(--primary-foreground);font:600 16px var(--font-latin);cursor:pointer}
input:focus-visible,button:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.err{color:var(--destructive-text);font-weight:600;margin:0 0 12px}
</style>
</head>
<body>
<!--ENARA_MARK-->
<main>
  <div class="brand"><svg class="mark" role="img" aria-label="ENARA"><use href="#enara-mark"/></svg><span class="word" aria-hidden="true">ENARA</span><span class="sub">Sales</span></div>
  <h1>Sales agent</h1>
  <p>Enter the team password to open the lead tracker.</p>
  <!--ERROR-->
  <form method="post" action="/login">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    <button type="submit">Open tracker</button>
  </form>
</main>
</body>
</html>
