</style><div class="v"><h2>How Clouds Form</h2><svg viewBox="0 0 600 360" width="100%" xmlns="http://www.w3.org/2000/svg"><rect width="600" height="360" fill="white"/><circle cx="510" cy="60" r="30" fill="#FFD54F" stroke="#F9A825" stroke-width="2"/><text x="510" y="20" text-anchor="middle" font-size="16" fill="#333">Sun</text><rect x="24" y="270" width="140" height="60" fill="#BBDEFB" stroke="#0056D2" stroke-width="2"/><text x="94" y="292" text-anchor="middle" font-size="16" fill="#333">Lake (water)</text><path d="M94 268 C100 240 150 235 165 205" stroke="#0056D2" stroke-width="3" fill="none"/><polygon points="165,205 156,214 172,216" fill="#0056D2"/><text x="185" y="255" font-size="16" fill="#333">water vapour rises</text><ellipse cx="330" cy="150" rx="80" ry="38" fill="#E3F2FD" stroke="#0056D2" stroke-width="2"/><text x="330" y="115" text-anchor="middle" font-size="16" fill="#333">Cloud</text><text x="330" y="176" text-anchor="middle" font-size="16" fill="#333">tiny drops</text><line x1="385" y1="175" x2="420" y2="250" stroke="#0056D2" stroke-width="2"/><polygon points="420,250 411,242 429,240" fill="#0056D2"/><text x="470" y="285" font-size="16" fill="#333">Rain</text><line x1="300" y1="188" x2="280" y2="230" stroke="#64B5F6" stroke-width="2"/><line x1="340" y1="188" x2="320" y2="230" stroke="#64B5F6" stroke-width="2"/><line x1="380" y1="188" x2="360" y2="230" stroke="#64B5F6" stroke-width="2"/></svg><p class="note">The Sun heats water. Water evaporates and rises as vapour. It cools and condenses into tiny drops that form clouds. Then rain falls.</p></div>
